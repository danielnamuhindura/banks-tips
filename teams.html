<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEAMS - BANKS TIPS</title>
<style>
body{font-family:Arial;margin:0;background:#f2f2f2;text-align:center;padding:10px}
h1{color:#0b3d91}
.card{background:white;margin:15px auto;padding:20px;border-radius:15px;max-width:500px;text-align:left}
.card h2{margin:0;color:#0b3d91}
input{width:90%;padding:12px;margin-top:10px;font-size:18px;text-align:center}
button{width:95%;padding:13px;margin-top:10px;background:#0b3d91;color:white;border:none;border-radius:10px;font-size:18px;font-weight:bold}
.teams{display:none;margin-top:15px;background:#fff3b0;padding:15px;border-radius:10px}
.team{padding:8px;border-bottom:1px solid #ddd;font-size:18px}
</style>
</head>
<body>
<h1>BANKS TIPS ⭐</h1>
<p><b>Enter your CODE to unlock your ticket teams.</b><br>No code? Pay first on main page, then WhatsApp us.</p>

<!-- 1. STANDARD - EMPTY - YOU WILL PUT TEAMS LATER -->
<div class="card">
<h2>1. STANDARD TICKET</h2>
<p>Pay R30 / $2 - Get STANDARD code</p>
<input type="password" id="code1" placeholder="Enter STANDARD Code" autocomplete="off">
<button onclick="unlock1()">UNLOCK STANDARD</button>
<div id="teams1" class="teams">
<!-- PUT STANDARD TEAMS HERE -->
</div>
</div>

<!-- 2. TRADE - EMPTY - YOU WILL PUT TEAMS LATER -->
<div class="card">
<h2>2. TRADE TICKET</h2>
<p>Pay R30 / $2 - Get TRADE code</p>
<input type="password" id="code2" placeholder="Enter TRADE Code" autocomplete="off">
<button onclick="unlock2()">UNLOCK TRADE</button>
<div id="teams2" class="teams">
<!-- PUT TRADE TEAMS HERE -->
</div>
</div>

<!-- 3. BANK - EMPTY - YOU WILL PUT TEAMS LATER -->
<div class="card">
<h2>3. BANK TICKET ⭐</h2>
<p>Pay R30 / $2 - Get BANK code</p>
<input type="password" id="code3" placeholder="Enter BANK Code" autocomplete="off">
<button onclick="unlock3()">UNLOCK BANK</button>
<div id="teams3" class="teams">
<!-- PUT BANK TEAMS HERE -->
</div>
</div>

<script>
// !!! YOU PUT YOUR OWN CODES HERE - I WILL NOT PUT CODES !!!
function unlock1(){ if(document.getElementById('code1').value.trim() === 'PUT_YOUR_STANDARD_CODE_HERE'){ document.getElementById('teams1').style.display='block'; alert('STANDARD Unlocked!'); } else { alert('Wrong STANDARD Code!'); } }
function unlock2(){ if(document.getElementById('code2').value.trim() === 'PUT_YOUR_TRADE_CODE_HERE'){ document.getElementById('teams2').style.display='block'; alert('TRADE Unlocked!'); } else { alert('Wrong TRADE Code!'); } }
function unlock3(){ if(document.getElementById('code3').value.trim() === 'PUT_YOUR_BANK_CODE_HERE'){ document.getElementById('teams3').style.display='block'; alert('BANK Unlocked!'); } else { alert('Wrong BANK Code!'); } }
</script>

<br><br>
<a href="index.html" style="display:block;background:#0b3d91;color:white;padding:18px;text-align:center;font-size:22px;font-weight:bold;border-radius:12px;text-decoration:none;">⬅️ BACK TO MAIN WEBSITE</a>
<br><br>
</body>
</html>
