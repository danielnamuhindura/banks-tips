<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADMIN - BANKY ONLY</title>
<style>
body{font-family:Arial;background:#111;color:white;padding:12px;text-align:center;margin:0}
.box{background:white;color:black;max-width:650px;margin:12px auto;padding:18px;border-radius:14px;text-align:left}
h1{color:#FFD700;font-size:24px}
h2{color:black;margin:18px 0 8px 0;font-size:20px;border-bottom:3px solid black;padding-bottom:5px}
input,select{width:100%;padding:14px;margin:6px 0;font-size:18px;border:3px solid black;border-radius:10px;background:white;color:black}
button{width:100%;padding:14px;margin:6px 0;border:none;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer;color:white}
.totalBox{background:#111;color:white;text-align:center;padding:14px;border-radius:10px;font-size:20px;font-weight:bold;margin:10px 0}
.totalBox span{color:#FFD700;font-size:26px}
.addBtn{background:#000}
.logoutBtn{background:#CC0000}
.refreshBtn{background:#000}
.clearBtn{background:#CC0000}
.code-row{background:#F2F2F2;padding:14px;border-radius:10px;margin:8px 0;border:2px solid black}
.code-row b{font-size:20px;color:black}
.statusFree{color:black;font-weight:bold;font-size:16px;background:#fff;border:2px solid black;padding:2px 8px;border-radius:6px}
.statusUsed{color:white;font-weight:bold;font-size:16px;background:#CC0000;padding:3px 9px;border-radius:6px}
.ticketName{font-size:16px;font-weight:bold;color:black}
.btnRow{display:flex;gap:6px;margin-top:10px}
.btnRow button{padding:10px 5px;font-size:15px;margin:0}
.showBtn{background:#0B3D91}
.copyBtn{background:#333}
.resetBtn{background:#E67E00}
.deleteBtn{background:#CC0000}
.small{font-size:14px;color:black;text-align:center;font-weight:bold}
</style>
</head>
<body>
<h1>🦁 BANKY ADMIN - PRIVATE!</h1>
<p>Only YOU!</p>

<div id="loginBox" class="box">
<h2>🔒 ENTER PASSWORD</h2>
<input type="password" id="adminPass" placeholder="PASSWORD">
<button class="addBtn" onclick="login()">OPEN ADMIN</button>
</div>

<div id="adminBox" class="box" style="display:none">
<button class="logoutBtn" onclick="logout()">🔒 LOGOUT</button>

<div class="totalBox">TOTAL CODES: <span id="totalCount">0</span></div>

<h2>➕ ADD NEW CODE</h2>
<input id="newCode" placeholder="TYPE NEW CODE" style="text-transform:uppercase">
<select id="newTicket">
<option value="1">STANDARD</option>
<option value="3">BANKER</option>
<option value="2">TRADE</option>
</select>
<button class="addBtn" onclick="addCode()">ADD CODE</button>

<h2>📋 ALL CODES</h2>
<button class="refreshBtn" onclick="loadCodes()">REFRESH LIST</button>
<div id="list">Loading...</div>

<h2>🧹 CLEAN UP</h2>
<button class="clearBtn" onclick="clearUsed()">CLEAR ALL USED - MAKE THEM FREE AGAIN</button>
</div>

<script type="module">
import { db } from "./lib/firebase.js";
import { ref, get, set, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
window.loadCodes = loadCodes;
window.addCode = addCode;
window.clearUsed = clearUsed;
window.login = login;
window.logout = logout;
window.deleteCode = deleteCode;
window.resetUsed = resetUsed;
window.toggleCode = toggleCode;
window.copyCode = copyCode;
let idleTimer;
function resetIdle(){ clearTimeout(idleTimer); idleTimer=setTimeout(()=>{ if(document.getElementById('adminBox').style.display==='block'){ logout(); alert('LOCKED! Enter password again!'); } },120000); }
document.addEventListener('click',resetIdle);
document.addEventListener('keydown',resetIdle);
function login(){
  if(document.getElementById('adminPass').value==='BANKY123'){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('adminBox').style.display='block';
    document.getElementById('adminPass').value='';
    resetIdle(); loadCodes();
  } else { alert('Wrong Password!'); }
}
function logout(){
  document.getElementById('adminBox').style.display='none';
  document.getElementById('loginBox').style.display='block';
  document.getElementById('list').innerHTML='';
  clearTimeout(idleTimer);
}
function maskCode(code){ if(code.length<=3) return '•••'; return code.substring(0,3)+'••••'; }
function toggleCode(code,btn){
  let el=document.getElementById('code-'+code);
  if(el.textContent.includes('•')){ el.textContent=code; btn.textContent='HIDE'; }
  else{ el.textContent=maskCode(code); btn.textContent='SHOW'; }
}
async function copyCode(code){ try{ await navigator.clipboard.writeText(code); alert('Copied!'); }catch(e){ alert('Code: '+code); } }
async function loadCodes(){
  document.getElementById('list').innerHTML='Loading...';
  try{
    const vSnap=await get(ref(db,"validCodes"));
    const uSnap=await get(ref(db,"usedCodes"));
    const valid=vSnap.exists()?vSnap.val():{};
    const used=uSnap.exists()?uSnap.val():{};
    let codes=Object.keys(valid);
    document.getElementById('totalCount').textContent=codes.length;
    if(codes.length===0){ document.getElementById('list').innerHTML='<p>No codes yet!</p>'; return; }
    codes.sort();
    let html='';
    for(let code of codes){
      let ticket=valid[code].ticket;
      let name=ticket==1?'STANDARD':ticket==3?'BANKER':'TRADE';
      let isUsed=used[code]?true:false;
      html+='<div class="code-row"><b id="code-'+code+'">'+maskCode(code)+'</b> - <span class="ticketName">'+name+'</span><br><br><span class="'+(isUsed?'statusUsed':'statusFree')+'">'+(isUsed?'USED':'FREE')+'</span><div class="btnRow"><button class="showBtn" onclick="toggleCode(\''+code+'\',this)">SHOW</button><button class="copyBtn" onclick="copyCode(\''+code+'\')">COPY</button><button class="resetBtn" onclick="resetUsed(\''+code+'\')">RESET</button><button class="deleteBtn" onclick="deleteCode(\''+code+'\')">DELETE</button></div></div>';
    }
    document.getElementById('list').innerHTML=html;
  }catch(e){ document.getElementById('list').innerHTML='Error: '+e.message; }
}
async function addCode(){
  let code=document.getElementById('newCode').value.trim().toUpperCase();
  let ticket=parseInt(document.getElementById('newTicket').value);
  if(!code){ alert('Type code first!'); return; }
  await set(ref(db,"validCodes/"+code),{ticket:ticket,createdAt:new Date().toISOString()});
  alert('ADDED! Customer can use it now!');
  document.getElementById('newCode').value='';
  loadCodes();
}
async function deleteCode(code){
  if(!confirm('Delete this code forever?')) return;
  await remove(ref(db,"validCodes/"+code));
  await remove(ref(db,"usedCodes/"+code));
  loadCodes();
}
async function resetUsed(code){
  await remove(ref(db,"usedCodes/"+code));
  alert('Code is FREE again!');
  loadCodes();
}
async function clearUsed(){
  if(!confirm('Clear ALL used? All become FREE again!')) return;
  await remove(ref(db,"usedCodes"));
  alert('All used cleared!');
  loadCodes();
}
</script>
</body>
</html>
