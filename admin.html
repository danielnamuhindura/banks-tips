<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADMIN - BANKY ONLY</title>
<style>
body{font-family:Arial;background:#111;color:white;padding:12px;text-align:center}
.box{background:white;color:#333;max-width:650px;margin:10px auto;padding:18px;border-radius:15px;text-align:left}
h1{color:#d4af37} h2{color:#0b3d91;margin-top:0}
input,select{width:95%;padding:12px;margin:6px 0;font-size:16px;border:2px solid #0b3d91;border-radius:10px}
button{width:100%;padding:13px;margin:6px 0;background:#0b3d91;color:white;border:none;border-radius:10px;font-size:17px;font-weight:bold}
.green{background:#008000} .red{background:#cc0000} .orange{background:#ff8800}
.code-row{display:flex;justify-content:space-between;align-items:center;background:#eee;padding:10px;border-radius:10px;margin:5px 0}
.used{color:#cc0000;font-weight:bold} .free{color:#008000;font-weight:bold}
.small{font-size:12px;color:#666;text-align:center}
</style>
</head>
<body>
<h1>🦁 BANKY ADMIN - PRIVATE!</h1>
<p>Only YOU! Do NOT share this link!</p>

<div id="loginBox" class="box">
<h2>🔒 Enter Admin Password</h2>
<input type="password" id="adminPass" placeholder="Admin Password">
<button onclick="login()">OPEN ADMIN</button>
<p class="small">Default password: BANKY123 - Change it later!</p>
</div>

<div id="adminBox" class="box" style="display:none">
<h2>➕ ADD NEW CODE</h2>
<input id="newCode" placeholder="Type new code e.g. STD508" style="text-transform:uppercase">
<select id="newTicket">
<option value="1">1 - STANDARD</option>
<option value="3">3 - BANKER</option>
<option value="2">2 - TRADE</option>
</select>
<button class="green" onclick="addCode()">✅ ADD CODE</button>

<h2>📋 ALL CODES</h2>
<button class="orange" onclick="loadCodes()">🔄 REFRESH LIST</button>
<div id="list">Loading...</div>

<h2>🧹 CLEAN UP</h2>
<button class="red" onclick="clearUsed()">🗑️ Clear ALL Used Codes - Make them FREE again</button>
<p class="small">Use this when you want to reuse old codes. Be careful!</p>
</div>

<script type="module">
import { db } from "./lib/firebase.js";
import { ref, get, set, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
window.loadCodes = loadCodes;
window.addCode = addCode;
window.clearUsed = clearUsed;
window.login = login;
window.deleteCode = deleteCode;
window.resetUsed = resetUsed;

function login(){
  if(document.getElementById('adminPass').value==='BANKY123'){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('adminBox').style.display='block';
    loadCodes();
  } else { alert('Wrong Admin Password!'); }
}
async function loadCodes(){
  document.getElementById('list').innerHTML='Loading...';
  try{
    const vSnap = await get(ref(db,"validCodes"));
    const uSnap = await get(ref(db,"usedCodes"));
    const valid = vSnap.exists()? vSnap.val() : {};
    const used = uSnap.exists()? uSnap.val() : {};
    let html='';
    const codes = Object.keys(valid);
    if(codes.length===0) html='<p>No codes yet! Add one above!</p>';
    codes.sort();
    for(let code of codes){
      let ticket = valid[code].ticket;
      let name = ticket==1?'STANDARD': ticket==3?'BANKER':'TRADE';
      let isUsed = used[code] ? true : false;
      html += '<div class="code-row"><span><b>'+code+'</b> - '+name+' - <span class="'+(isUsed?'used':'free')+'">'+(isUsed?'USED ❌':'FREE ✅')+'</span></span><span><button style="width:auto;padding:6px 10px;background:#ff8800" onclick="resetUsed(\''+code+'\')">Reset</button> <button style="width:auto;padding:6px 10px;background:#cc0000" onclick="deleteCode(\''+code+'\')">Delete</button></span></div>';
    }
    document.getElementById('list').innerHTML=html;
  }catch(e){ document.getElementById('list').innerHTML='Error: '+e.message; }
}
async function addCode(){
  let code=document.getElementById('newCode').value.trim().toUpperCase();
  let ticket=parseInt(document.getElementById('newTicket').value);
  if(!code){ alert('Type code first!'); return; }
  await set(ref(db,"validCodes/"+code),{ticket:ticket, createdAt:new Date().toISOString()});
  alert('✅ '+code+' ADDED! Customer can use it now!');
  document.getElementById('newCode').value='';
  loadCodes();
}
async function deleteCode(code){
  if(!confirm('Delete '+code+' forever?')) return;
  await remove(ref(db,"validCodes/"+code));
  await remove(ref(db,"usedCodes/"+code));
  loadCodes();
}
async function resetUsed(code){
  await remove(ref(db,"usedCodes/"+code));
  alert('✅ '+code+' is FREE again! Customer can use it!');
  loadCodes();
}
async function clearUsed(){
  if(!confirm('Clear ALL used codes? All codes become FREE again!')) return;
  await remove(ref(db,"usedCodes"));
  alert('✅ All used cleared!');
  loadCodes();
}
</script>
</body>
</html>
