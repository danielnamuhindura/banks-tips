<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADMIN - BANKS TIPS</title>
<style>
body{font-family:Arial;background:#111;color:white;text-align:center;padding:20px}
.card{background:white;color:black;margin:15px auto;padding:20px;border-radius:15px;max-width:450px;text-align:left}
input{width:90%;padding:13px;margin:8px 0;font-size:18px;text-align:center}
button{width:95%;padding:14px;background:#0b3d91;color:white;border:none;border-radius:10px;font-size:19px;font-weight:bold;margin-top:10px}
label{font-weight:bold}
</style>
</head>
<body>
<h1>🔒 ADMIN ONLY</h1>
<p>Banks Tips - Change Codes Here</p>
<div id="login" class="card">
<label>MASTER PASSWORD</label><br>
<input type="password" id="master" placeholder="Enter Master Password">
<button onclick="login()">LOGIN</button>
<p style="font-size:13px;color:#666">Default Master: BANKS123</p>
</div>
<div id="panel" class="card" style="display:none">
<label>1. STANDARD CODE</label><br>
<input id="c1" placeholder="STANDARD Code">
<label>2. TRADE CODE</label><br>
<input id="c2" placeholder="TRADE Code">
<label>3. BANK CODE</label><br>
<input id="c3" placeholder="BANK Code">
<button onclick="save()">SAVE ALL CODES</button>
<button onclick="resetCodes()" style="background:#cc0000">RESET TO OLD CODES</button>
<p id="msg" style="color:green;font-weight:bold;text-align:center"></p>
</div>
<script>
function login(){
  if(document.getElementById('master').value === 'BANKS123'){
    document.getElementById('login').style.display='none';
    document.getElementById('panel').style.display='block';
    document.getElementById('c1').value = localStorage.getItem('code1') || 'DARD16';
    document.getElementById('c2').value = localStorage.getItem('code2') || 'TAD500';
    document.getElementById('c3').value = localStorage.getItem('code3') || 'BNK20';
  } else { alert('Wrong Master Password!'); }
}
function save(){
  localStorage.setItem('code1', document.getElementById('c1').value.trim());
  localStorage.setItem('code2', document.getElementById('c2').value.trim());
  localStorage.setItem('code3', document.getElementById('c3').value.trim());
  document.getElementById('msg').innerText = 'SAVED! New codes are now LIVE.';
  alert('Saved! New codes are now LIVE.');
}
function resetCodes(){
  localStorage.setItem('code1','DARD16');
  localStorage.setItem('code2','TAD500');
  localStorage.setItem('code3','BNK20');
  document.getElementById('c1').value='DARD16';
  document.getElementById('c2').value='TAD500';
  document.getElementById('c3').value='BNK20';
  alert('Reset to old codes!');
}
</script>
</body>
</html>
